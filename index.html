<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayak Rapids</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b2a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    color: #e8f5e9;
  }
  h1 { margin-bottom: 8px; letter-spacing: 2px; color: #a5d6a7; }
  #wrap { position: relative; }
  canvas { display: block; background: #1a5276; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 8px 12px;
    font-size: 16px;
    font-weight: bold;
  }
  #msg {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(0,0,0,.75);
    padding: 24px 32px;
    border-radius: 12px;
    display: none;
    font-size: 18px;
  }
  #msg button {
    margin-top: 16px;
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #43a047;
    color: white;
    cursor: pointer;
  }
  #msg button:hover { background: #2e7d32; }
  .keys { font-size: 13px; opacity: .8; margin-top: 6px; }
</style>
</head>
<body>
<h1>Kayak Rapids</h1>
<div id="wrap">
  <div id="hud">
    <span id="score">Score: 0</span>
    <span id="speed">Speed: 1.0x</span>
    <span id="hp">Hull: 100</span>
  </div>
  <canvas id="game" width="600" height="700"></canvas>
  <div id="msg">
    <div id="msgTitle">Game Over</div>
    <div id="msgScore"></div>
    <button id="restart">Play Again</button>
  </div>
</div>
<div class="keys">Arrow keys to steer &amp; paddle | Hold Down for brake | Dodge rocks, grab splashes</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const $score = document.getElementById('score');
  const $speed = document.getElementById('speed');
  const $hp = document.getElementById('hp');
  const msg = document.getElementById('msg');
  const msgTitle = document.getElementById('msgTitle');
  const msgScore = document.getElementById('msgScore');

  const keys = {};
  addEventListener('keydown', e => { keys[e.key] = true; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); });
  addEventListener('keyup', e => { keys[e.key] = false; });

  const kayak = {
    x: W / 2,
    y: H - 130,
    w: 46,
    h: 90,
    baseSpeed: 2.2,
    maxSpeed: 6.5,
    steerSpeed: 3.2,
    hull: 100,
  };

  let obstacles = [];
  let splashes = [];
  let waves = [];
  let score = 0;
  let gameOver = false;
  let dist = 0;
  let time = 0;
  let spawnTimer = 0;
  let hardTimer = 0;

  let log = 0; // paddle animation phase

  function reset() {
    kayak.x = W / 2; kayak.y = H - 130; kayak.hull = 100;
    obstacles = []; splashes = []; waves = [];
    score = 0; dist = 0; time = 0; spawnTimer = 0; hardTimer = 0;
    gameOver = false; log = 0;
    msg.style.display = 'none';
    updateHud();
  }

  function currentSpeed() {
    let s = kayak.baseSpeed + dist / 2200;
    if (keys['ArrowUp']) s *= 1.8;
    if (keys['ArrowDown']) s *= 0.35;
    return Math.min(s, kayak.maxSpeed + dist / 4000);
  }

  function updateHud() {
    $score.textContent = 'Score: ' + Math.floor(score);
    $speed.textContent = 'Speed: ' + currentSpeed().toFixed(1) + 'x';
    $hp.textContent = 'Hull: ' + Math.max(0, Math.round(kayak.hull));
  }

  function spawn() {
    const margin = 70;
    const x = margin + Math.random() * (W - margin * 2);
    const type = Math.random();
    if (type < 0.6) {
      const r = 20 + Math.random() * 22;
      obstacles.push({ kind: 'rock', x, r, vy: 0, s: 1 + Math.random() * 0.5 });
    } else if (type < 0.9) {
      const len = 56 + Math.random() * 50;
      const w = 14 + Math.random() * 8;
      obstacles.push({ kind: 'log', x, len, w, vy: 0, s: 1 + Math.random() * 0.5, spin: Math.random() * 0.02 });
    } else {
      splashes.push({ x, y: -20, r: 10, taken: false, wob: Math.random() * 6.28 });
    }
  }

  function collide(ox, oy, radius) {
    const kx = kayak.x, ky = kayak.y;
    const kHalf = kayak.w / 2, kHalfY = kayak.h / 2;
    const cx = Math.max(kx - kHalf, Math.min(ox, kx + kHalf));
    const cy = Math.max(ky - kHalfY, Math.min(oy, ky + kHalfY));
    const dx = ox - cx, dy = oy - cy;
    return (dx * dx + dy * dy) < radius * radius;
  }

  function hurt(amount) {
    kayak.hull -= amount;
    if (kayak.hull <= 0) {
      kayak.hull = 0;
      gameOver = true;
      msgTitle.textContent = 'Swamped!';
      msgScore.textContent = 'You flipped. Final score: ' + Math.floor(score);
      msg.style.display = 'block';
    }
    updateHud();
  }

  function update(dt) {
    if (gameOver) return;

    time += dt;
    dist += currentSpeed();
    score += currentSpeed() * dt;

    // steering
    if (keys['ArrowLeft']) kayak.x -= kayak.steerSpeed * dt * 60 / 1000 * (60/60);
    if (keys['ArrowRight']) kayak.x += kayak.steerSpeed * dt * 60 / 1000 * (60/60);
    kayak.x = Math.max(kayak.w / 2 + 6, Math.min(W - kayak.w / 2 - 6, kayak.x));
    // allow small vertical shift for fun
    if (keys['ArrowUp'] || keys['ArrowDown']) kayak.y += (keys['ArrowDown'] ? 0.7 : -0.35) * dt * 60 / 1000 * 0;

    log += dt * (2 + currentSpeed());

    const spd = currentSpeed();

    // spawn
    spawnTimer -= dt * 60;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = Math.max(24, 52 - hardTimer) + Math.random() * 42;
    }
    hardTimer += dt;

    // move obstacles
    for (const o of obstacles) {
      o.y += spd * 0.9;
      o.x += Math.sin(time * 0.5 + o.s * 7) * 0.4;
      if (o.kind === 'log') o.spin += 0.01;
    }
    for (const s of splashes) s.y += spd * 0.9;

    obstacles = obstacles.filter(o => o.y < H + 100);
    splashes = splashes.filter(s => s.y < H + 100);

    // collisions
    for (const o of obstacles) {
      const r = o.kind === 'rock' ? o.r : Math.max(o.w, o.len) * 0.5;
      if (o.y > kayak.y - 120 && collide(o.x, o.y, r * 0.75)) {
        if (o.kind === 'rock') hurt(18); else hurt(8);
        o.y = H + 200; // pushed past
        score -= 15;
        break;
      }
    }
    for (const s of splashes) {
      if (!s.taken && s.y > kayak.y - 80 && collide(s.x, s.y, s.r)) {
        s.taken = true;
        score += 60;
        s.y = H + 200;
        updateHud();
      }
    }

    // waves
    if (Math.random() < 0.25) waves.push({ x: Math.random() * W, y: -10, w: 30 + Math.random() * 50, a: 0.3 + Math.random() * 0.3, s: 40 + Math.random() * 60 });
    waves = waves.filter(w => w.y < H);

    updateHud();
  }

  function drawKayak() {
    const { x, y, w, h } = kayak;
    const tilt = (keys['ArrowLeft'] ? -1 : keys['ArrowRight'] ? 1 : 0) * 0.12;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);

    // hull
    ctx.beginPath();
    ctx.moveTo(0, -h / 2);
    ctx.quadraticCurveTo(w / 2 + 4, -h / 2 + 20, w / 2, 0);
    ctx.quadraticCurveTo(w / 2 + 4, h / 2 - 20, 0, h / 2);
    ctx.quadraticCurveTo(-w / 2 - 4, h / 2 - 20, -w / 2, 0);
    ctx.quadraticCurveTo(-w / 2 - 4, -h / 2 + 20, 0, -h / 2);
    ctx.fillStyle = '#2e7d32';
    ctx.fill();
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 3;
    ctx.stroke();

    // cockpit
    ctx.beginPath();
    ctx.ellipse(0, 0, w * 0.34, h * 0.38, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#10271b';
    ctx.fill();

    // paddler
    ctx.beginPath();
    ctx.arc(0, -4, 11, 0, Math.PI * 2);
    ctx.fillStyle = '#f5b971';
    ctx.fill();
    // hat
    ctx.beginPath();
    ctx.arc(0, -8, 12, Math.PI, 0);
    ctx.fillStyle = '#c62828';
    ctx.fill();
    // torso
    ctx.fillStyle = '#1565c0';
    ctx.fillRect(-8, 6, 16, 12);
    ctx.strokeStyle = '#0d47a1';
    ctx.strokeRect(-8, 6, 16, 12);

    // paddle
    const pl = 60;
    const phase = Math.sin(log);
    const ang = -0.9 + phase * 0.55;
    const px = Math.cos(ang) * pl;
    const py = Math.sin(ang) * pl + 8;
    ctx.strokeStyle = '#8d6e63';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-px, -py);
    ctx.lineTo(px, py);
    ctx.stroke();
    // paddle blades
    ctx.fillStyle = '#5d4037';
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(4, 0, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(-px, -py);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(-4, 0, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();

    // water spray at front
    if (currentSpeed() > 3) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 0; i < 4; i++) {
        const a = Math.random() * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * (w / 2 + 6), y + h / 2 + 6, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function draw() {
    // water
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#145a85');
    grad.addColorStop(1, '#0f3d5e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // river flow lines
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const x = (i * 77 + time * 20) % (W + 60) - 30;
      for (let yy = 0; yy < H; yy += 90) {
        ctx.beginPath();
        ctx.moveTo(x, yy + ((time * 40 + i * 50) % 90));
        ctx.lineTo(x + 20, yy + ((time * 40 + i * 50) % 90));
        ctx.stroke();
      }
    }

    // banks
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(0, 0, 10, H);
    ctx.fillRect(W - 10, 0, 10, H);
    ctx.fillStyle = '#1b5e20';
    ctx.fillRect(0, 0, 6, H);
    ctx.fillRect(W - 6, 0, 6, H);

    // waves
    for (const w of waves) {
      ctx.beginPath();
      const a = w.a * (1 - w.y / H);
      ctx.strokeStyle = 'rgba(255,255,255,' + a + ')';
      ctx.lineWidth = 2;
      ctx.moveTo(w.x, w.y);
      ctx.quadraticCurveTo(w.x + w.w / 2, w.y - 8, w.x + w.w, w.y);
      ctx.stroke();
      w.y += w.s * 0.05;
    }

    // splashes (bonus)
    for (const s of splashes) {
      if (s.taken) continue;
      const pulse = 1 + Math.sin(time * 4 + s.wob) * 0.15;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.wob);
      ctx.strokeStyle = 'rgba(120,220,255,0.9)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 4, Math.sin(a) * 4);
        ctx.lineTo(Math.cos(a) * 10 * pulse, Math.sin(a) * 10 * pulse);
        ctx.stroke();
      }
      ctx.restore();
    }

    // obstacles
    for (const o of obstacles) {
      if (o.kind === 'rock') {
        ctx.beginPath();
        ctx.moveTo(o.x - o.r, o.y + o.r * 0.4);
        ctx.lineTo(o.x - o.r * 0.6, o.y - o.r * 0.6);
        ctx.lineTo(o.x, o.y - o.r);
        ctx.lineTo(o.x + o.r * 0.7, o.y - o.r * 0.4);
        ctx.lineTo(o.x + o.r, o.y + o.r * 0.5);
        ctx.closePath();
        ctx.fillStyle = '#546e7a';
        ctx.fill();
        ctx.strokeStyle = '#37474f';
        ctx.lineWidth = 3;
        ctx.stroke();
        // highlight
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(o.x - o.r * 0.4, o.y - o.r * 0.7);
        ctx.lineTo(o.x + o.r * 0.1, o.y - o.r * 0.9);
        ctx.stroke();
      } else {
        // log with bark texture
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.spin);
        const grad = ctx.createLinearGradient(0, -o.w / 2, 0, o.w / 2);
        grad.addColorStop(0, '#8d6e63');
        grad.addColorStop(0.5, '#5d4037');
        grad.addColorStop(1, '#3e2723');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(-o.len / 2, -o.w / 2, o.len, o.w, o.w / 2);
        ctx.fill();
        ctx.strokeStyle = '#2f1c14';
        ctx.lineWidth = 2;
        ctx.stroke();
        // wood grain lines
        ctx.strokeStyle = 'rgba(120,90,60,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-o.len / 2 + 8, -2);
        ctx.quadraticCurveTo(0, -6, o.len / 2 - 8, 0);
        ctx.moveTo(-o.len / 2 + 8, 2);
        ctx.quadraticCurveTo(0, 6, o.len / 2 - 8, 0);
        ctx.stroke();
        // cut ends (rings)
        ctx.fillStyle = '#8d6e63';
        ctx.beginPath();
        ctx.arc(-o.len / 2, 0, o.w / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#4e342e';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-o.len / 2, 0, o.w * 0.18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    drawKayak();

    // bottom spray
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    for (let i = 0; i < 6; i++) {
      const sx = Math.random() * W;
      ctx.beginPath();
      ctx.arc(sx, H - Math.random() * 14, 2 + Math.random() * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop() {
    update(16.7);
    if (!gameOver) draw();
    else draw(); // keep last frame
    requestAnimationFrame(loop);
  }

  document.getElementById('restart').addEventListener('click', reset);

  reset();
  loop();
})();
</script>
</body>
</html>
